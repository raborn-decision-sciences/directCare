services:
  dca:
    build:
      context: .
      dockerfile: directCareAnalytics/Dockerfile
    image: directcare/dca:latest
    restart: unless-stopped
    # No `ports:` here deliberately -- Caddy is the only intended entry
    # point (it reaches this service over the internal Compose network at
    # dca:3838, per the Caddyfile), so traffic gets TLS/HSTS. Publishing
    # this directly to the host would let it be reached over plain HTTP,
    # bypassing Caddy entirely. For local/CI testing without Caddy, layer
    # docker-compose.ci.yml on top instead of adding ports here.
    environment:
      GOLEM_CONFIG_ACTIVE: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: directcare
      DB_USER: directcare
      DB_PASSWORD_FILE: /run/secrets/db_password
      ZEPTOMAIL_TOKEN_FILE: /run/secrets/zeptomail_token
      FROM_EMAIL: noreply@directcareanalytics.com
      APP_BASE_URL: https://app.directcareanalytics.com
    # Compose's file-based secrets preserve the *host-side* file's owner/
    # permissions when mounted -- they do NOT support a per-secret `mode`/
    # `uid`/`gid` override outside Swarm mode (confirmed live: Compose
    # prints "secrets `uid`, `gid` and `mode` are not supported, they will
    # be ignored" and does exactly that). This container runs as the
    # unprivileged `appuser` (UID 1000, pinned in base.Dockerfile -- see
    # its comment), not root, so the *host* secret files must be owned by
    # UID 1000 for it to read them -- see DEPLOY.md Step 4 /
    # secrets/README.md, which `chown`/`chmod` them accordingly. (A plain
    # `chmod 600` root-owned file, the original convention, isn't readable
    # by appuser at all -- confirmed live: "cannot open file
    # '/run/secrets/db_password': Permission denied" on first production
    # deploy, since the official Postgres image's entrypoint reads its own
    # copy of this same secret while still running as root, before
    # dropping privileges internally, but this app's R process runs fully
    # as appuser from the start.)
    secrets:
      - db_password
      - zeptomail_token
    depends_on:
      - db

  planner:
    build:
      context: .
      dockerfile: directCarePlanner/Dockerfile
    image: directcare/planner:latest
    restart: unless-stopped
    # Same reasoning as dca's `ports:` omission above.
    environment:
      GOLEM_CONFIG_ACTIVE: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: directcare
      DB_USER: directcare
      DB_PASSWORD_FILE: /run/secrets/db_password
      ZEPTOMAIL_TOKEN_FILE: /run/secrets/zeptomail_token
      FROM_EMAIL: noreply@directcareanalytics.com
      APP_BASE_URL: https://planner.directcareanalytics.com
    # Same reasoning as dca's secrets block above.
    secrets:
      - db_password
      - zeptomail_token
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: directcare
      POSTGRES_USER: directcare
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  zeptomail_token:
    file: ./secrets/zeptomail_token.txt
