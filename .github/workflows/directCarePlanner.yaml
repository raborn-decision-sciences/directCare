# Workflow for directCarePlanner: a Golem Shiny app that depends on three
# sibling packages in this same monorepo, directCareData, directCarePlanR,
# and directCareScenarios, all declared via `Remotes:` GitHub references in
# DESCRIPTION. As with directCarePlanR.yaml, `pak` (used internally by
# r-lib/actions/setup-r-dependencies) cannot resolve a local sibling
# package when solving "local::." -- same confirmed limitation, same
# workaround: skip pak-based dependency resolution entirely. Install every
# CRAN dependency (the sibling packages' own, plus directCarePlanner's)
# via plain `install.packages()` FIRST -- directCareScenarios itself
# depends on bsicons/DBI/shiny, so it must not be `R CMD INSTALL`ed before
# those are available -- then install all three sibling packages locally
# via `R CMD INSTALL`, then run `rcmdcheck::rcmdcheck()` directly.
#
# Unlike directCarePlanR, directCarePlanner's tests don't exercise the
# PDF-report download handler (no testServer() call touches
# output$dl_report), so no Typst binary is needed here.

on:
  push:
    branches: [main, PlanR]
    paths: ["directCarePlanner/**", "directCarePlanR/**", "directCareData/**", "directCareScenarios/**", ".github/workflows/directCarePlanner.yaml"]
  pull_request:
    branches: [main, PlanR]
    paths: ["directCarePlanner/**", "directCarePlanR/**", "directCareData/**", "directCareScenarios/**", ".github/workflows/directCarePlanner.yaml"]
  workflow_dispatch: {}

name: directCarePlanner.yaml

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install CRAN dependencies (directCarePlanR, directCareScenarios, and directCarePlanner)
        # Must run before the local R CMD INSTALLs below -- directCareScenarios
        # itself depends on bsicons/DBI/shiny, so installing it before those
        # are available fails with "dependencies ... are not available"
        # (confirmed: this exact ordering bug previously broke CI, only
        # directCarePlanner's own deps were installed after the local
        # packages instead of before).
        run: |
          Rscript -e 'install.packages(c("dplyr", "jsonlite", "rlang", "tibble", "bcrypt", "bsicons", "bslib", "config", "DBI", "DT", "ggplot2", "golem", "RPostgres", "scales", "shiny", "shinymanager", "thematic", "testthat", "withr", "rcmdcheck"))'

      - name: Install local directCareData, directCarePlanR, and directCareScenarios
        run: |
          R CMD INSTALL directCareData
          R CMD INSTALL directCarePlanR
          R CMD INSTALL directCareScenarios

      - name: Check directCarePlanner
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck("directCarePlanner", args = c("--no-manual"), error_on = "warning")'
