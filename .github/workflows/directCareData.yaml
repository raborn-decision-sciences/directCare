# Workflow for directCareData: a pure reference-data package (no runtime
# Imports, no external network access at check time -- data/*.rda ships
# pre-populated). Standard R CMD check, scoped to this package's own
# subdirectory via working-directory and path filters.

on:
  push:
    branches: [main, PlanR]
    paths: ["directCareData/**", ".github/workflows/directCareData.yaml"]
  pull_request:
    branches: [main, PlanR]
    paths: ["directCareData/**", ".github/workflows/directCareData.yaml"]
  workflow_dispatch: {}

name: directCareData.yaml

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: directCareData
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: directCareData
          error-on: '"warning"'
          upload-snapshots: true
