# Builds the self-hosting Docker images (docker/base.Dockerfile plus both
# app Dockerfiles) and brings up db+dca+planner via Compose, then polls
# each app's root URL for a 200 response as a liveness smoke test. Caddy is
# skipped here -- it needs real DNS/TLS it won't have on a CI runner, so
# docker-compose.ci.yml publishes dca/planner ports directly instead.
#
# This does not test an actual shinymanager login round-trip (the
# `practices` table is empty in a fresh CI database) -- it only confirms
# both images build and both apps come up and serve their login page.

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "directCareAnalytics/**"
      - "directCarePlanner/**"
      - "directCareAuth/**"
      - "directCareForecastR/**"
      - "directCarePlanR/**"
      - "directCareData/**"
      - "db/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "Caddyfile"
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/docker.yaml"
  pull_request:
    branches: [main]
    paths:
      - "docker/**"
      - "directCareAnalytics/**"
      - "directCarePlanner/**"
      - "directCareAuth/**"
      - "directCareForecastR/**"
      - "directCarePlanR/**"
      - "directCareData/**"
      - "db/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "Caddyfile"
      - "Makefile"
      - ".dockerignore"
      - ".github/workflows/docker.yaml"
  workflow_dispatch: {}

name: docker.yaml

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Plain `docker build`/`docker compose build` on the runner's default
      # builder, not docker/setup-buildx-action's docker-container builder.
      # That builder runs BuildKit in an isolated container with its own
      # image store -- `--load` imports its output into the Docker daemon,
      # but a later build submitted to that same isolated builder can't see
      # it back out again for a `FROM directcare-base:latest` reference, and
      # tries (and fails) to pull it from Docker Hub instead. The default
      # builder shares the daemon's image store directly, so this chaining
      # just works -- same as `make deploy` on the VPS.
      - name: Build base image
        run: docker build -f docker/base.Dockerfile -t directcare-base:latest .

      - name: Build app images
        run: docker compose build

      - name: Generate ephemeral CI-only secrets
        run: |
          mkdir -p secrets
          openssl rand -base64 32 > secrets/db_password.txt
          # Placeholder only -- CI never exercises the actual ZeptoMail send
          # path (no email-sending E2E test), this just lets the containers
          # boot without a missing-secret-file error.
          echo "ci-placeholder-not-a-real-token" > secrets/zeptomail_token.txt

      - name: Start db, dca, planner (no caddy in CI)
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d db dca planner

      - name: Wait for apps to serve their login page
        run: |
          for url in http://localhost:3838 http://localhost:3939; do
            echo "Waiting on $url"
            ok=""
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || echo "000")
              if [ "$code" = "200" ]; then
                echo "$url responded 200"
                ok=1
                break
              fi
              sleep 3
            done
            if [ -z "$ok" ]; then
              echo "$url never returned 200"
              exit 1
            fi
          done

      - name: Show service logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
