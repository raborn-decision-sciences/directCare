# Workflow for directCarePlanR. Two monorepo-specific issues beyond a
# standard R CMD check:
#
# 1. directCarePlanR depends on directCareData, a sibling package in this
#    same monorepo, declared via a `Remotes:` GitHub reference in
#    DESCRIPTION. `pak` (which r-lib/actions/setup-r-dependencies uses
#    internally) cannot be made to treat an already-installed local copy
#    of a non-CRAN package as satisfying that dependency when solving
#    "local::." -- confirmed by direct reproduction: even with
#    directCareData already installed (via plain `R CMD INSTALL`, no pak
#    involved) and even with the `Remotes:` field removed entirely,
#    `pak::pkg_deps("local::.")` still fails with
#    "Can't find package called directCareData". This appears to be a pak
#    limitation with local/non-CRAN sibling dependencies, not a
#    configuration problem on our end. Workaround: skip pak-based
#    dependency resolution for this package entirely. Install
#    directCareData locally via `R CMD INSTALL`, install directCarePlanR's
#    own CRAN dependencies via plain `install.packages()`, and run
#    `rcmdcheck::rcmdcheck()` directly -- verified locally to produce a
#    clean check with this exact sequence.
# 2. report.R's tests do a real (not mocked) Typst compile, so the
#    `typst` CLI must be on PATH. ubuntu-latest has no package-manager
#    typst, so this downloads the official prebuilt Linux binary
#    directly from GitHub's stable "latest" release URL.

on:
  push:
    branches: [main, PlanR]
    paths: ["directCarePlanR/**", "directCareData/**", ".github/workflows/directCarePlanR.yaml"]
  pull_request:
    branches: [main, PlanR]
    paths: ["directCarePlanR/**", "directCareData/**", ".github/workflows/directCarePlanR.yaml"]
  workflow_dispatch: {}

name: directCarePlanR.yaml

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install Typst
        run: |
          curl -sL -o typst.tar.xz \
            "https://github.com/typst/typst/releases/latest/download/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xf typst.tar.xz
          install_dir="$(realpath "$(find . -maxdepth 1 -type d -name 'typst-*')")"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install local directCareData
        run: R CMD INSTALL directCareData

      - name: Install directCarePlanR's own dependencies
        run: |
          Rscript -e 'install.packages(c("dplyr", "jsonlite", "rlang", "tibble", "testthat", "typr", "rcmdcheck"))'

      - name: Check directCarePlanR
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck("directCarePlanR", args = c("--no-manual"), error_on = "warning")'
