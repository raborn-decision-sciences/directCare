services:
  dca:
    build:
      context: .
      dockerfile: directCareAnalytics/Dockerfile
    image: directcare/dca:latest
    restart: unless-stopped
    # Performance Backlog Phase 4 (TODO.md): shinycannon load test against
    # the real droplet (2026-08-13) measured this container's memory at
    # ~1.38GB in-test peak under 25 concurrent full workflows (including
    # PDF generation), rising to ~1.49GB several minutes after the test
    # ended and CPU was already back to idle -- possibly just GC lag, not
    # confirmed either way. 2.5g gives real headroom above both those
    # numbers while capping the previously-unbounded worst case, so a
    # runaway/leak here can't starve planner/billing/db on the same host.
    # CPU is deliberately left unlimited: the same test found this
    # container already saturates the droplet's full 2 vCPUs under load
    # (the actual capacity ceiling, see TODO.md) -- constraining cpus
    # further would only make that worse, not better.
    mem_limit: 2.5g
    # Docker's default json-file driver has no size cap -- on a
    # long-running server, container logs grow unbounded and can
    # eventually fill the disk, taking down the whole stack (not just
    # logging). 10m x 3 files = 30 MB max per service, well within
    # budget. Same block repeated on every service below.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # No `ports:` here deliberately -- Caddy is the only intended entry
    # point (it reaches this service over the internal Compose network at
    # dca:3838, per the Caddyfile), so traffic gets TLS/HSTS. Publishing
    # this directly to the host would let it be reached over plain HTTP,
    # bypassing Caddy entirely. For local/CI testing without Caddy, layer
    # docker-compose.ci.yml on top instead of adding ports here.
    environment:
      GOLEM_CONFIG_ACTIVE: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: directcare
      DB_USER: directcare
      DB_PASSWORD_FILE: /run/secrets/db_password
      ZEPTOMAIL_TOKEN_FILE: /run/secrets/zeptomail_token
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      FROM_EMAIL: noreply@directcareanalytics.com
      APP_BASE_URL: https://app.directcareanalytics.com
    # Compose's file-based secrets preserve the *host-side* file's owner/
    # permissions when mounted -- they do NOT support a per-secret `mode`/
    # `uid`/`gid` override outside Swarm mode (confirmed live: Compose
    # prints "secrets `uid`, `gid` and `mode` are not supported, they will
    # be ignored" and does exactly that). This container runs as the
    # unprivileged `appuser` (UID 1000, pinned in base.Dockerfile -- see
    # its comment), not root, so the *host* secret files must be owned by
    # UID 1000 for it to read them -- see DEPLOY.md Step 4 /
    # secrets/README.md, which `chown`/`chmod` them accordingly. (A plain
    # `chmod 600` root-owned file, the original convention, isn't readable
    # by appuser at all -- confirmed live: "cannot open file
    # '/run/secrets/db_password': Permission denied" on first production
    # deploy, since the official Postgres image's entrypoint reads its own
    # copy of this same secret while still running as root, before
    # dropping privileges internally, but this app's R process runs fully
    # as appuser from the start.)
    secrets:
      - db_password
      - zeptomail_token
      - stripe_secret_key
    depends_on:
      - db

  planner:
    build:
      context: .
      dockerfile: directCarePlanner/Dockerfile
    image: directcare/planner:latest
    restart: unless-stopped
    # Same reasoning as dca's `logging:` block above.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Same reasoning as dca's `ports:` omission above.
    environment:
      GOLEM_CONFIG_ACTIVE: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: directcare
      DB_USER: directcare
      DB_PASSWORD_FILE: /run/secrets/db_password
      ZEPTOMAIL_TOKEN_FILE: /run/secrets/zeptomail_token
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      FROM_EMAIL: noreply@directcareanalytics.com
      APP_BASE_URL: https://planner.directcareanalytics.com
    # Same reasoning as dca's secrets block above.
    secrets:
      - db_password
      - zeptomail_token
      - stripe_secret_key
    depends_on:
      - db

  billing:
    build:
      context: .
      dockerfile: billing-service/Dockerfile
    image: directcare/billing:latest
    restart: unless-stopped
    # Same reasoning as dca's `logging:` block above.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Same reasoning as dca's `ports:` omission above -- Caddy is the only
    # intended entry point (billing.directcareanalytics.com).
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: directcare
      DB_USER: directcare
      DB_PASSWORD_FILE: /run/secrets/db_password
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret
      # lookup_key -> plan_tier mapping (STRIPE_BILLING.md Part 3) -- must
      # match the STRIPE_LOOKUP_KEY_STARTER/_PRO constants both apps send
      # when creating a Checkout Session (utils_billing.R). Plain env vars,
      # not secrets -- lookup_keys aren't sensitive, same reasoning as
      # FROM_EMAIL/APP_BASE_URL above.
      STRIPE_PRICE_STARTER: starter_monthly
      STRIPE_PRICE_PRO: pro_monthly
    secrets:
      - db_password
      - stripe_secret_key
      - stripe_webhook_secret
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: directcare
      POSTGRES_USER: directcare
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    # Same reasoning as dca's `logging:` block above.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/errors:/srv/errors:ro
      - caddy_data:/data
    restart: unless-stopped
    # Same reasoning as dca's `logging:` block above.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  caddy_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  zeptomail_token:
    file: ./secrets/zeptomail_token.txt
  stripe_secret_key:
    file: ./secrets/stripe_secret_key.txt
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret.txt
